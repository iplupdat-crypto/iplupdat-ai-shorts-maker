
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPL UPDATE Shorts Maker</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#08111f;color:white;font-family:Arial,sans-serif}
.container{max-width:760px;margin:20px auto;background:#142238;padding:24px;border-radius:16px}
h1{text-align:center;color:#ffcc33}
h2{text-align:center}
p{text-align:center;color:#cbd5e1}
label{display:block;margin-top:18px;font-weight:bold}
input,select,button{width:100%;padding:13px;margin-top:9px;border:0;border-radius:8px;font-size:16px}
button{background:#e52b36;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
#status{margin-top:18px;padding:14px;background:#08111f;border-radius:8px;color:#ffcc33;white-space:pre-wrap;overflow-wrap:anywhere}
.progress{height:10px;background:#334155;border-radius:10px;overflow:hidden;margin-top:12px}
#bar{height:100%;width:0;background:#ffcc33;transition:width .3s}
video{width:100%;max-height:350px;margin-top:12px;background:black}
.clip{background:#263b59;padding:15px;margin-top:12px;border-radius:10px}
.clip a{display:block;background:#167347;padding:12px;color:white;text-decoration:none;text-align:center;border-radius:8px;margin-top:10px}
small{color:#b8c5d8;line-height:1.6}
</style>
</head>
<body>

<div class="container">
<h1>IPL UPDATE</h1>
<h2>SHORTS MAKER</h2>
<p>Create Multiple YouTube Shorts</p>

<label>1. Upload Your Long Video</label>
<input type="file" id="videoFile" accept="video/*">
<video id="preview" controls hidden></video>

<label>2. Number of Shorts</label>
<select id="count">
<option value="1">1 Short</option>
<option value="2" selected>2 Shorts</option>
<option value="3">3 Shorts</option>
<option value="4">4 Shorts</option>
<option value="5">5 Shorts</option>
<option value="6">6 Shorts</option>
<option value="7">7 Shorts</option>
<option value="8">8 Shorts</option>
<option value="9">9 Shorts</option>
<option value="10">10 Shorts</option>
</select>

<label>3. Short Duration</label>
<select id="duration">
<option value="30">30 Seconds</option>
<option value="45">45 Seconds</option>
<option value="60" selected>60 Seconds</option>
</select>

<label>4. Video Quality</label>
<select id="quality">
<option value="540">540p - Faster</option>
<option value="720" selected>720p - HD</option>
</select>

<button id="startBtn" onclick="startMaker()">GENERATE SHORTS</button>

<div class="progress"><div id="bar"></div></div>
<div id="status">Upload a video to get started.</div>
<div id="results"></div>

<p><small>
Shorts are cut automatically in sequence from the beginning.
Vertical 9:16 format with original audio.
MP4 format. No captions or extra text.
</small></p>
</div>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

<script>
const fileInput=document.getElementById("videoFile");
const preview=document.getElementById("preview");
const statusBox=document.getElementById("status");
const bar=document.getElementById("bar");
const startBtn=document.getElementById("startBtn");
const results=document.getElementById("results");

let videoDuration=0;
let ffmpeg=null;
let ffmpegReady=false;

function showStatus(message,percent){
 statusBox.textContent=message;
 if(percent!==undefined){
  bar.style.width=Math.max(0,Math.min(100,percent))+"%";
 }
}

fileInput.addEventListener("change",()=>{
 const file=fileInput.files[0];
 if(!file)return;

 preview.src=URL.createObjectURL(file);
 preview.hidden=false;

 preview.onloadedmetadata=()=>{
  videoDuration=preview.duration;
  showStatus(
   "Video ready.\nDuration: "+Math.floor(videoDuration)+" seconds."
  );
 };
});

async function loadFFmpeg(){
 if(ffmpegReady)return;

 showStatus("Loading video editing engine...",5);

 if(!window.FFmpeg){
  throw new Error("FFmpeg library could not load. Check internet connection.");
 }

 const {createFFmpeg}=FFmpeg;

 ffmpeg=createFFmpeg({
  log:false,
  mainName:"main",
  corePath:"https://unpkg.com/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js"
 });

 await ffmpeg.load();
 ffmpegReady=true;
}

async function startMaker(){
 const file=fileInput.files[0];

 if(!file){
  alert("Please upload a video first.");
  return;
 }

 if(!videoDuration){
  alert("Please wait until video duration loads.");
  return;
 }

 const count=Number(document.getElementById("count").value);
 const seconds=Number(document.getElementById("duration").value);
 const quality=Number(document.getElementById("quality").value);

 const possible=Math.min(count,Math.floor(videoDuration/seconds));

 if(possible<1){
  alert("Video is too short for the selected Short duration.");
  return;
 }

 startBtn.disabled=true;
 results.innerHTML="";
 bar.style.width="0%";

 try{
  await loadFFmpeg();

  showStatus("Loading your video into editor...",10);

  const inputName="original_video.mp4";
  const inputData=new Uint8Array(await file.arrayBuffer());

  ffmpeg.FS("writeFile",inputName,inputData);

  const height=quality;
  const width=Math.floor((height*9/16)/2)*2;
  const totalSeconds=possible*seconds;

  showStatus(
   "Creating "+possible+" MP4 Shorts...\nPlease wait. Do not close this page.",
   20
  );

  const args=[
   "-nostdin",
   "-y",
   "-i",inputName,
   "-t",String(totalSeconds),
   "-vf",
   "scale="+width+":"+height+
   ":force_original_aspect_ratio=increase,crop="+width+":"+height,
   "-c:v","libx264",
   "-preset","ultrafast",
   "-crf","28",
   "-pix_fmt","yuv420p",
   "-force_key_frames","expr:gte(t,n_forced*"+seconds+")",
   "-c:a","aac",
   "-b:a","128k",
   "-f","segment",
   "-segment_time",String(seconds),
   "-segment_format","mp4",
   "-reset_timestamps","1",
   "-segment_start_number","1",
   "short_%03d.mp4"
  ];

  try{
   await ffmpeg.run(...args);
  }catch(error){
   const message=String(error.message||error);
   if(!message.includes("exit(0)")){
    throw error;
   }
  }

  showStatus("Checking created MP4 files...",85);

  const files=ffmpeg.FS("readdir","/")
   .filter(name=>/^short_\d+\.mp4$/.test(name))
   .sort();

  if(files.length===0){
   throw new Error("MP4 files were not found. Please try a smaller video or 540p.");
  }

  let created=0;

  for(const name of files){
   if(created>=possible)break;

   const data=ffmpeg.FS("readFile",name);
   const blob=new Blob([data],{type:"video/mp4"});
   const url=URL.createObjectURL(blob);

   const card=document.createElement("div");
   card.className="clip";

   const heading=document.createElement("h3");
   heading.textContent="Short "+(created+1);

   const download=document.createElement("a");
   download.href=url;
   download.download="IPL_UPDATE_SHORT_"+(created+1)+".mp4";
   download.textContent="DOWNLOAD MP4";

   card.appendChild(heading);
   card.appendChild(download);
   results.appendChild(card);

   created++;
  }

  showStatus(
   "Completed! "+created+" MP4 Shorts created.",
   100
  );

 }catch(error){
  console.error(error);
  showStatus("ERROR: "+error.message);
  alert("Shorts creation failed:\n"+error.message);
 }finally{
  startBtn.disabled=false;
 }
}
</script>
</body>
</html>
